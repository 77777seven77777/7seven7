<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7seven - The Hub</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Ambient Particles -->
    <div class="particles">
        <div class="particle" style="left: 10%; animation-duration: 15s; animation-delay: 0s;"></div>
        <div class="particle" style="left: 30%; animation-duration: 25s; animation-delay: -5s;"></div>
        <div class="particle" style="left: 50%; animation-duration: 18s; animation-delay: -2s;"></div>
        <div class="particle" style="left: 70%; animation-duration: 22s; animation-delay: -8s;"></div>
        <div class="particle" style="left: 90%; animation-duration: 20s; animation-delay: -1s;"></div>
    </div>

    <!-- Animated Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <main class="container">
        
        <div class="icon-glass pulse-anim">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
        </div>

        <h2 class="subtitle">Welcome to the realm of</h2>

        <div class="main-pill float-anim">
            <h1>7seven</h1>
        </div>

        <div class="btn-group">
            <a href="learn_more.html" class="btn-glass">Enter the Legend →</a>
            <a href="donate.html" class="btn-glass btn-donate">Donate 💎</a>
        </div>

    </main>
</body>
</html>
